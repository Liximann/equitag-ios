workflows:
  equitag-ios:
    name: EquiTag iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: EquiTag
    environment:
      groups:
        - equitag
      vars:
        BUNDLE_ID: de.equitag.app
      xcode: latest
    scripts:
      - name: Xcode-Projekt erzeugen
        script: |
          brew install xcodegen
          export BUILD_NUMBER=${BUILD_NUMBER:-1}
          xcodegen generate
      - name: Signierung vorbereiten
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: App bauen
        script: |
          xcode-project build-ipa --project "EquiTag.xcodeproj" --scheme "EquiTag"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
